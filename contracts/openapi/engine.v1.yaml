openapi: 3.1.0
info:
  title: Code AI Platform — AI Engine (internal)
  version: 1.0.0
  description: |
    Backend ↔ AI Engine 내부 API. 외부(웹/앱)에 노출하지 않는다.
    ★ 단일 진실 원천(SSOT). 변경은 Claude만 수행하며, 변경 후 `make gen-clients`로 모델을 재생성한다.
    공통 규약(에러·SSE·페이지네이션·멱등성·헤더)은 docs/architecture/03-api-conventions.md 를 따른다.

    - 에러: RFC 9457 (RFC 7807 호환) `application/problem+json`, `code`는 `EngineErrorCode`.
    - 스트리밍: `text/event-stream`, 이벤트 envelope는 `StreamEvent` (discriminator `event`). 재개(resume) 불가.
    - 목록: cursor 페이지네이션 (`CursorPageInfo`).
servers:
  - url: http://ai-engine:8100
    description: docker-compose 내부 네트워크
security:
  - internalToken: []

tags:
  - name: system
  - name: generation
  - name: indexing
  - name: retrieval
  - name: analysis

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 엔진 및 의존 컴포넌트 상태. degraded여도 200을 반환한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /v1/adapters:
    get:
      tags: [system]
      operationId: listAdapters
      parameters:
        - { name: stage, in: query, required: false, schema: { $ref: "#/components/schemas/AdapterStage" } }
        - { name: task, in: query, required: false, schema: { $ref: "#/components/schemas/AdapterTask" } }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 등록된 LoRA 어댑터 목록 (소량이므로 페이지네이션 없음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdapterList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/generate:
    post:
      tags: [generation]
      operationId: generate
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateRequest" }
      responses:
        "200":
          description: 생성 결과
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/generate/stream:
    post:
      tags: [generation]
      operationId: generateStream
      description: |
        Raw LLM 스트리밍 (RAG 없음). 이벤트 순서: `meta` → `token`* → (`done` | `error`).
        스트림 시작 전 오류는 일반 Problem 응답(4xx/5xx), 시작 후 오류는 `error` 이벤트로 전달하고 연결을 닫는다.
      x-sse: { policy: "#/components/x-sse-policy" }
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateRequest" }
      responses:
        "200":
          description: SSE 스트림. 각 이벤트의 data는 StreamEvent JSON 한 줄.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { schema: { type: string, const: no-cache } }
            X-Accel-Buffering: { schema: { type: string, const: "no" } }
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/chat/stream:
    post:
      tags: [generation]
      operationId: chatStream
      description: |
        RAG 기반 코드 대화 스트리밍 (data-flow §4). 이벤트 순서: `meta` → `sources` → `token`* → (`done` | `error`).
      x-sse: { policy: "#/components/x-sse-policy" }
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatStreamRequest" }
      responses:
        "200":
          description: SSE 스트림 (StreamEvent)
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestId" }
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/index:
    post:
      tags: [indexing]
      operationId: createIndexJob
      description: |
        코드베이스 (증분) 색인 잡을 시작한다 (data-flow §3).
        같은 project_id의 queued/running 잡이 있으면 409 `job_conflict` (Problem.detail에 기존 job_id).
        같은 Idempotency-Key로 24시간 내 재요청하면 최초 응답의 잡을 그대로 반환한다.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexRequest" }
      responses:
        "202":
          description: 잡 생성됨
          headers:
            Location: { schema: { type: string }, description: "/v1/index/{job_id}" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        default: { $ref: "#/components/responses/InternalError" }
    get:
      tags: [indexing]
      operationId: listIndexJobs
      parameters:
        - { name: project_id, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/JobStatus" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 색인 잡 목록 (created_at 내림차순)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJobPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/index/{job_id}:
    get:
      tags: [indexing]
      operationId: getIndexJob
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 잡 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/index/{job_id}/cancel:
    post:
      tags: [indexing]
      operationId: cancelIndexJob
      description: queued/running 잡을 취소한다. 이미 종료된 잡이면 현재 상태를 그대로 반환한다 (멱등).
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 취소 요청됨 (배치 경계에서 중단, status → canceled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/collections/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [indexing]
      operationId: getCollection
      responses:
        "200":
          description: 색인 통계
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [indexing]
      operationId: dropCollection
      responses:
        "204": { description: 삭제됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/retrieve:
    post:
      tags: [retrieval]
      operationId: retrieve
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetrieveRequest" }
      responses:
        "200":
          description: 유사 코드 청크 (score 내림차순)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrieveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/analyze:
    post:
      tags: [analysis]
      operationId: analyze
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyzeRequest" }
      responses:
        "200":
          description: 분석 결과 (구조화된 Finding 목록)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
        default: { $ref: "#/components/responses/InternalError" }

  /v1/refactor:
    post:
      tags: [analysis]
      operationId: refactor
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefactorRequest" }
      responses:
        "200":
          description: unified diff 패치와 검증 결과. 검증 실패도 200으로 반환한다 (validation 필드 확인).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefactorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
        default: { $ref: "#/components/responses/InternalError" }

components:
  # SSE 정책 (operation의 x-sse가 참조). 구현과 클라이언트 모두 이 값을 따른다.
  x-sse-policy:
    retry_ms: 3000            # 스트림 첫 줄에 `retry: 3000` 전송
    keepalive_interval_s: 15  # 이벤트가 없으면 `: keepalive` 주석 줄 전송
    first_event_timeout_s: 30 # 요청 후 meta 이벤트까지 최대 대기
    idle_timeout_s: 45        # 클라이언트: 어떤 바이트도 없이 45초 경과 시 연결 종료로 간주
    max_duration_s: 600       # 서버: 스트림 전체 상한 (초과 시 error: generation_timeout)
    event_id_format: "{stream_id}:{seq}"
    resumable: false          # Engine 스트림은 재개 불가. 끊기면 Backend가 생성 취소 후 사용자에게 error 전달

  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: Backend만 아는 내부 서비스 토큰 (ENGINE_INTERNAL_TOKEN)

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 요청 추적 ID. 없으면 서버가 UUIDv4 생성 후 응답 헤더와 Problem.request_id에 담는다.
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 24시간 유효. 같은 키 + 다른 본문이면 422 validation_error.
      schema: { type: string, minLength: 8, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 page.next_cursor (opaque). 생략 시 첫 페이지.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }

  headers:
    XRequestId:
      description: 요청 추적 ID (요청 헤더 값 또는 서버 생성값)
      schema: { type: string }
    RetryAfter:
      description: 재시도까지 대기할 초
      schema: { type: integer, minimum: 0 }

  responses:
    ValidationError:
      description: 요청 검증 실패 (validation_error, unsupported_language, parse_error)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: 내부 토큰 누락/불일치
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 리소스 없음 (not_found, adapter_not_found, collection_not_found)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: 상태 충돌 (job_conflict)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: 컨텍스트 예산 초과 (context_too_large)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadGateway:
      description: 모델 출력 검증 실패 (structured_output_invalid)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: 의존 컴포넌트 장애 (provider_unavailable, embedding_failed, vector_store_error)
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    GatewayTimeout:
      description: 생성 시간 초과 (generation_timeout)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: 예상하지 못한 오류 (internal_error)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ------------------------------------------------------------------ errors
    EngineErrorCode:
      type: string
      description: |
        Engine 에러 코드. `source: core` 코드는 engine.core.errors 의 예외 클래스 `code`와 1:1 대응한다
        (services/ai-engine/tests/contract/test_error_codes.py 가 검증). `source: api` 코드는 API 레이어가 생성한다.
      enum:
        - validation_error
        - unauthorized
        - not_found
        - rate_limited
        - internal_error
        - provider_unavailable
        - adapter_not_found
        - generation_timeout
        - structured_output_invalid
        - context_too_large
        - embedding_failed
        - vector_store_error
        - collection_not_found
        - unsupported_language
        - parse_error
        - job_conflict
      x-error-catalog:
        validation_error:          { status: 422, retryable: false, source: api }
        unauthorized:              { status: 401, retryable: false, source: api }
        not_found:                 { status: 404, retryable: false, source: api }
        rate_limited:              { status: 429, retryable: true,  source: api }
        internal_error:            { status: 500, retryable: false, source: core }
        provider_unavailable:      { status: 503, retryable: true,  source: core }
        adapter_not_found:         { status: 404, retryable: false, source: core }
        generation_timeout:        { status: 504, retryable: true,  source: core }
        structured_output_invalid: { status: 502, retryable: true,  source: core }
        context_too_large:         { status: 413, retryable: false, source: core }
        embedding_failed:          { status: 503, retryable: true,  source: core }
        vector_store_error:        { status: 503, retryable: true,  source: core }
        collection_not_found:      { status: 404, retryable: false, source: core }
        unsupported_language:      { status: 422, retryable: false, source: core }
        parse_error:               { status: 422, retryable: false, source: core }
        job_conflict:              { status: 409, retryable: false, source: core }

    FieldError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          description: 오류 위치 (예 ["body", "messages", 0, "content"])
          items: { oneOf: [{ type: string }, { type: integer }] }
        msg: { type: string }
        type: { type: string, description: 검증 오류 종류 (예 missing, string_too_short) }

    Problem:
      type: object
      description: RFC 9457 Problem Details (RFC 7807 호환). 확장 필드는 code 이하.
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          format: uri-reference
          description: "/problems/{code}"
          examples: [/problems/provider_unavailable]
        title: { type: string, description: 코드별 고정 요약 (사람이 읽는 용도) }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: 이번 발생 건의 구체적 설명 }
        instance: { type: string, format: uri-reference, description: 요청 경로 }
        code: { $ref: "#/components/schemas/EngineErrorCode" }
        retryable: { type: boolean }
        retry_after_s: { type: [integer, "null"], minimum: 0 }
        request_id: { type: string }
        errors:
          type: array
          description: validation_error일 때 필드별 오류
          items: { $ref: "#/components/schemas/FieldError" }

    # -------------------------------------------------------------- pagination
    CursorPageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, "null"], description: 다음 페이지 cursor. 마지막 페이지면 null }
        has_more: { type: boolean }

    # ------------------------------------------------------------------ system
    ComponentHealth:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        latency_ms: { type: [integer, "null"] }
        detail: { type: [string, "null"] }

    HealthResponse:
      type: object
      required: [status, version, components]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        components:
          type: object
          description: 키 = llm | embedder | vector_store | registry
          additionalProperties: { $ref: "#/components/schemas/ComponentHealth" }

    AdapterStage:
      type: string
      enum: [candidate, staging, production, archived]

    AdapterTask:
      type: string
      enum: [analyze, refactor, explain, general]

    AdapterInfo:
      type: object
      required: [name, version, base_model, task, stage, dataset_hash, eval_scores, created_at]
      properties:
        name: { type: string, description: "서빙 엔진 등록명 (예 refactor-v3)" }
        version: { type: string }
        base_model: { type: string, examples: [Qwen/Qwen2.5-Coder-7B-Instruct] }
        task: { $ref: "#/components/schemas/AdapterTask" }
        stage: { $ref: "#/components/schemas/AdapterStage" }
        dataset_hash: { type: string }
        eval_scores:
          type: object
          additionalProperties: { type: number }
        created_at: { type: string, format: date-time }

    AdapterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdapterInfo" }

    # -------------------------------------------------------------- generation
    Role:
      type: string
      enum: [system, user, assistant]

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        content: { type: string, maxLength: 200000 }

    GenerationParams:
      type: object
      properties:
        temperature: { type: number, minimum: 0, maximum: 2, default: 0.2 }
        top_p: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.95 }
        max_tokens: { type: integer, minimum: 1, maximum: 8192, default: 2048 }
        stop: { type: array, maxItems: 8, items: { type: string }, default: [] }
        seed: { type: [integer, "null"] }

    GenerateRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/ChatMessage" }
        adapter:
          type: [string, "null"]
          description: null이면 base 모델
        params: { $ref: "#/components/schemas/GenerationParams" }
        json_schema:
          type: [object, "null"]
          description: 지정 시 구조화 출력 강제 (Ollama format / vLLM guided decoding)
        timeout_s: { type: number, minimum: 1, maximum: 600, default: 120 }

    TokenUsage:
      type: object
      required: [prompt_tokens, completion_tokens]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }

    FinishReason:
      type: string
      enum: [stop, length, error, canceled]

    GenerateResponse:
      type: object
      required: [text, model, finish_reason, usage, latency_ms]
      properties:
        text: { type: string }
        model: { type: string }
        adapter: { type: [string, "null"] }
        finish_reason: { $ref: "#/components/schemas/FinishReason" }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        latency_ms: { type: integer, minimum: 0 }

    ChatStreamRequest:
      type: object
      required: [project_id, messages]
      properties:
        project_id: { type: string }
        messages:
          type: array
          minItems: 1
          maxItems: 64
          description: 대화 이력. 마지막 메시지는 role=user 여야 한다.
          items: { $ref: "#/components/schemas/ChatMessage" }
        context_paths:
          type: array
          maxItems: 20
          description: 사용자가 명시적으로 첨부한 파일 (우선순위 2로 컨텍스트에 포함)
          items: { type: string }
        top_k: { type: integer, minimum: 0, maximum: 20, default: 8 }
        adapter: { type: [string, "null"], description: "null이면 task=explain production 어댑터, 없으면 base" }
        params: { $ref: "#/components/schemas/GenerationParams" }
        timeout_s: { type: number, minimum: 1, maximum: 600, default: 180 }

    # --------------------------------------------------------- SSE envelope
    StreamEventType:
      type: string
      enum: [meta, sources, token, done, error]

    StreamMetaEvent:
      type: object
      description: 첫 이벤트. 이후 이벤트의 id는 "{stream_id}:{seq}".
      required: [event, stream_id, request_id, model]
      properties:
        event: { type: string, const: meta }
        stream_id: { type: string }
        request_id: { type: string }
        model: { type: string }
        adapter: { type: [string, "null"] }

    StreamSourcesEvent:
      type: object
      description: chat 스트림 전용. 컨텍스트로 사용한 청크 목록.
      required: [event, sources]
      properties:
        event: { type: string, const: sources }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }

    StreamTokenEvent:
      type: object
      required: [event, index, delta]
      properties:
        event: { type: string, const: token }
        index: { type: integer, minimum: 0, description: 0부터 1씩 증가 (누락 검출용) }
        delta: { type: string }

    StreamDoneEvent:
      type: object
      description: 정상 종료. 이후 서버가 연결을 닫는다.
      required: [event, finish_reason, usage, latency_ms]
      properties:
        event: { type: string, const: done }
        finish_reason: { $ref: "#/components/schemas/FinishReason" }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        latency_ms: { type: integer, minimum: 0 }

    StreamErrorEvent:
      type: object
      description: 스트림 도중 오류. 이후 서버가 연결을 닫는다.
      required: [event, error]
      properties:
        event: { type: string, const: error }
        error: { $ref: "#/components/schemas/Problem" }

    StreamEvent:
      description: |
        SSE data 필드의 JSON. wire 형식:
          id: {stream_id}:{seq}
          event: {event}
          data: {StreamEvent JSON}
      oneOf:
        - $ref: "#/components/schemas/StreamMetaEvent"
        - $ref: "#/components/schemas/StreamSourcesEvent"
        - $ref: "#/components/schemas/StreamTokenEvent"
        - $ref: "#/components/schemas/StreamDoneEvent"
        - $ref: "#/components/schemas/StreamErrorEvent"
      discriminator:
        propertyName: event
        mapping:
          meta: "#/components/schemas/StreamMetaEvent"
          sources: "#/components/schemas/StreamSourcesEvent"
          token: "#/components/schemas/StreamTokenEvent"
          done: "#/components/schemas/StreamDoneEvent"
          error: "#/components/schemas/StreamErrorEvent"

    # ---------------------------------------------------------------- indexing
    RepoSource:
      type: object
      description: 엔진이 읽을 코드 위치. 공유 볼륨 읽기 전용 마운트 (Q3 결정).
      required: [local_path]
      properties:
        local_path:
          type: string
          description: 엔진 컨테이너 기준 절대 경로. /data/repos/ 하위만 허용.
          pattern: "^/data/repos/[a-zA-Z0-9_-]+/?$"
        commit_sha: { type: [string, "null"], pattern: "^[0-9a-f]{7,40}$" }
        include_globs: { type: array, maxItems: 50, items: { type: string }, default: [] }
        exclude_globs: { type: array, maxItems: 50, items: { type: string }, default: [] }

    IndexMode:
      type: string
      enum: [incremental, full]

    IndexRequest:
      type: object
      required: [project_id, source]
      properties:
        project_id: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }
        source: { $ref: "#/components/schemas/RepoSource" }
        mode: { $ref: "#/components/schemas/IndexMode" }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]

    IndexStats:
      type: object
      required: [files_scanned, files_changed, files_deleted, chunks_upserted]
      properties:
        files_scanned: { type: integer, minimum: 0 }
        files_changed: { type: integer, minimum: 0 }
        files_deleted: { type: integer, minimum: 0 }
        files_skipped: { type: integer, minimum: 0 }
        chunks_upserted: { type: integer, minimum: 0 }

    JobProgress:
      type: object
      required: [current, total]
      properties:
        current: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        phase: { type: string, enum: [scanning, chunking, embedding, upserting] }

    IndexJob:
      type: object
      required: [job_id, project_id, status, mode, created_at]
      properties:
        job_id: { type: string }
        project_id: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        mode: { $ref: "#/components/schemas/IndexMode" }
        commit_sha: { type: [string, "null"] }
        progress: { oneOf: [{ $ref: "#/components/schemas/JobProgress" }, { type: "null" }] }
        stats: { oneOf: [{ $ref: "#/components/schemas/IndexStats" }, { type: "null" }] }
        error: { oneOf: [{ $ref: "#/components/schemas/Problem" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    IndexJobPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/IndexJob" } }
        page: { $ref: "#/components/schemas/CursorPageInfo" }

    CollectionStats:
      type: object
      required: [project_id, chunk_count, file_count, embed_model, dimension]
      properties:
        project_id: { type: string }
        chunk_count: { type: integer, minimum: 0 }
        file_count: { type: integer, minimum: 0 }
        embed_model: { type: string, examples: [nomic-embed-text] }
        dimension: { type: integer, minimum: 1 }
        last_commit_sha: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }

    # --------------------------------------------------------------- retrieval
    MetadataScalar:
      type: [string, number, boolean]

    MetadataScalarList:
      type: array
      maxItems: 50
      items: { $ref: "#/components/schemas/MetadataScalar" }

    MetadataFilter:
      type: object
      description: "AND 결합 동등 비교. 값이 배열이면 IN. 허용 키: path, language, kind, symbol"
      propertyNames: { enum: [path, language, kind, symbol] }
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/MetadataScalar"
          - $ref: "#/components/schemas/MetadataScalarList"

    RetrieveRequest:
      type: object
      required: [project_id, query]
      properties:
        project_id: { type: string }
        query: { type: string, minLength: 1, maxLength: 8000 }
        top_k: { type: integer, minimum: 1, maximum: 50, default: 8 }
        min_score: { type: number, minimum: 0, maximum: 1, default: 0 }
        where: { $ref: "#/components/schemas/MetadataFilter" }

    ChunkKind:
      type: string
      enum: [module, class, function, method, window]

    CodeChunk:
      type: object
      required: [chunk_id, path, language, kind, symbol, text, start_line, end_line]
      properties:
        chunk_id: { type: string }
        path: { type: string }
        language: { type: string }
        kind: { $ref: "#/components/schemas/ChunkKind" }
        symbol: { type: string }
        text: { type: string }
        start_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        commit_sha: { type: [string, "null"] }

    RetrievedChunk:
      type: object
      required: [chunk, score]
      properties:
        chunk: { $ref: "#/components/schemas/CodeChunk" }
        score: { type: number, minimum: 0, maximum: 1 }

    SourceRef:
      type: object
      description: 본문 없는 청크 참조 (SSE sources 이벤트, 응답 메타용)
      required: [chunk_id, path, symbol, start_line, end_line, score]
      properties:
        chunk_id: { type: string }
        path: { type: string }
        symbol: { type: string }
        start_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        score: { type: number, minimum: 0, maximum: 1 }

    RetrieveResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RetrievedChunk" }

    # ---------------------------------------------------------------- analysis
    CodeTarget:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1 }
        start_line: { type: [integer, "null"], minimum: 1 }
        end_line: { type: [integer, "null"], minimum: 1 }
        content:
          type: [string, "null"]
          maxLength: 200000
          description: 미커밋 편집본. null이면 색인된 저장소에서 읽는다.

    Severity:
      type: string
      enum: [info, minor, major, critical]

    FindingCategory:
      type: string
      enum: [bug, security, performance, maintainability, style]

    Finding:
      type: object
      required: [id, category, severity, title, message, path, start_line, end_line]
      properties:
        id: { type: string, description: "결정적 ID: sha1(path:start:end:title)[:12]" }
        category: { $ref: "#/components/schemas/FindingCategory" }
        severity: { $ref: "#/components/schemas/Severity" }
        title: { type: string, maxLength: 200 }
        message: { type: string }
        path: { type: string }
        start_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        suggestion: { type: [string, "null"] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }

    AnalyzeRequest:
      type: object
      required: [project_id, targets]
      properties:
        project_id: { type: string }
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CodeTarget" }
        instruction: { type: [string, "null"], maxLength: 4000 }
        categories:
          type: array
          description: 비어 있으면 전체 카테고리
          items: { $ref: "#/components/schemas/FindingCategory" }
          default: []
        adapter:
          type: [string, "null"]
          description: null이면 task=analyze의 production 어댑터, 없으면 base 모델
        timeout_s: { type: number, minimum: 1, maximum: 600, default: 180 }

    AnalyzeResponse:
      type: object
      required: [findings, summary, model, prompt_version, context, usage, latency_ms]
      properties:
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        summary: { type: string }
        model: { type: string }
        adapter: { type: [string, "null"] }
        prompt_version: { type: string, examples: [analyze.v1], description: "피드백 루프(§5) 재현용" }
        context:
          type: array
          description: 컨텍스트로 사용한 청크 (피드백 루프 재현용)
          items: { $ref: "#/components/schemas/SourceRef" }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        latency_ms: { type: integer, minimum: 0 }

    RefactorRequest:
      type: object
      required: [project_id, target, instruction]
      properties:
        project_id: { type: string }
        target: { $ref: "#/components/schemas/CodeTarget" }
        instruction: { type: string, minLength: 1, maxLength: 4000 }
        finding: { oneOf: [{ $ref: "#/components/schemas/Finding" }, { type: "null" }], description: 원인 Finding (있으면 프롬프트에 포함) }
        adapter: { type: [string, "null"] }
        timeout_s: { type: number, minimum: 1, maximum: 600, default: 240 }

    PatchValidation:
      type: object
      required: [applies_cleanly, syntax_ok, attempts]
      properties:
        applies_cleanly: { type: boolean, description: git apply --check 결과 }
        syntax_ok: { type: boolean, description: tree-sitter ERROR 노드 없음 }
        attempts: { type: integer, minimum: 1, maximum: 2, description: 생성 시도 횟수 (재시도 1회 포함) }
        errors: { type: array, items: { type: string }, default: [] }

    RefactorResponse:
      type: object
      required: [diff, explanation, validation, model, prompt_version, context, usage, latency_ms]
      properties:
        diff: { type: string, description: unified diff (git apply 호환, a/ b/ prefix) }
        explanation: { type: string }
        validation: { $ref: "#/components/schemas/PatchValidation" }
        model: { type: string }
        adapter: { type: [string, "null"] }
        prompt_version: { type: string, examples: [refactor.v1] }
        context:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        latency_ms: { type: integer, minimum: 0 }
