[project]
name = "ai-engine"
version = "0.1.0"
description = "추론(Ollama/vLLM) + RAG(LangChain/Chroma) + 코드 분석 내부 서비스"
requires-python = ">=3.12"
dependencies = [
    "py-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "chromadb-client>=0.5",
    "tree-sitter>=0.25,<0.26",  # 0.26.0은 Windows에서 Point 접근 시 segfault (S-02)
    "tree-sitter-language-pack>=0.2",
    "jinja2>=3.1",
    "pathspec>=0.12",
    "unidiff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
