[project]
name = "backend"
version = "0.1.0"
description = "공개 API Gateway: 인증, 프로젝트, 분석 잡, 채팅(SSE), 푸시"
requires-python = ">=3.12"
dependencies = [
    "py-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "pyjwt>=2.9",
    "firebase-admin>=6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
