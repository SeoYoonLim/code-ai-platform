name: code-ai-platform

services:
  llama-server:
    # Set the verified RepoDigest after Claude's pull/inspect (no Docker in Codex scope).
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ports: ["8080:8080"]
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./.data/models:/models:ro
      - ./.data/adapters:/adapters:ro
      - ./infra/llama/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    # ADR-0002: RTX 4060 8GB 예산 (7B Q4_K_M · 8K ctx · KV q8_0 · 2 슬롯 ≈ 5.9GB)
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"   # LLM(GPU) + 임베딩(CPU, num_gpu=0)
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
      - ./infra/ollama:/modelfiles:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chroma:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    volumes: [chroma:/data]
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: codeai
      POSTGRES_PASSWORD: codeai
      POSTGRES_DB: codeai
    volumes: [pg:/var/lib/postgresql/data]

  ai-engine:
    build: { context: ., dockerfile: infra/docker/ai-engine.Dockerfile }
    ports: ["8100:8100"]
    env_file: .env
    environment:
      ENGINE_LLM_PROVIDER: llamacpp
      ENGINE_LLAMACPP_URL: http://llama-server:8080
      ENGINE_OLLAMA_URL: http://ollama:11434
      ENGINE_CHROMA_URL: http://chroma:8000
      ENGINE_REGISTRY_PATH: /registry/adapters.json
    volumes:
      - repos:/data/repos:ro
      - ./ml/registry:/registry:ro
    depends_on: [ollama, chroma]
    profiles: [app]

  backend:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      BACKEND_ENGINE_URL: http://ai-engine:8100
      BACKEND_DATABASE_URL: postgresql+asyncpg://codeai:codeai@postgres:5432/codeai
      BACKEND_REDIS_URL: redis://redis:6379/0
      BACKEND_REPOS_DIR: /data/repos
    volumes:
      - repos:/data/repos
    depends_on: [postgres, redis, ai-engine]
    profiles: [app]

volumes:
  ollama:
  chroma:
  pg:
  repos:
