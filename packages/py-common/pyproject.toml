[project]
name = "py-common"
version = "0.1.0"
description = "공용 설정/로깅/에러 + contracts/openapi 에서 생성된 Pydantic 모델"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_common"]
