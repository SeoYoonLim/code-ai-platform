name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: make check

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.17"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: make gen-clients
      - run: make verify-clients
      - name: Check generated client drift
        shell: bash
        run: |
          paths=(
            packages/py-common/src/py_common/generated
            apps/web/src/lib/api
            apps/mobile/packages/api_client
          )
          # 변경·신규 파일을 한 번에 수집한다. 원본 로그는 인증 없이 볼 수 없으므로
          # 파일 목록을 annotation(공개)으로도 남긴다.
          status=$(git status --porcelain --untracked-files=all -- "${paths[@]}")
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            git diff --stat -- "${paths[@]}"
            summary=$(printf '%s\n' "$status" | head -n 20 | tr '\n' ';')
            echo "::error title=Generated client drift::생성물이 contracts와 불일치합니다. 'make gen-clients' 후 커밋하세요. 변경 파일(최대 20): ${summary}"
            exit 1
          fi
